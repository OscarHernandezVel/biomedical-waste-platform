spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

spring.application.name=biomedical-waste-platform
server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:residuos_biomedicos}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${MYSQL_USERNAME:root}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${MYSQL_PASSWORD:}}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

spring.jackson.serialization.write-dates-as-timestamps=false

app.cors.origin=${FRONTEND_ORIGIN:http://localhost:5173,https://traebiomedical-frontedxit2.vercel.app}
app.adminKey=${ADMIN_API_KEY:}

supabase.project.ref=${SUPABASE_PROJECT_REF:}
supabase.jwt.secret=${SUPABASE_JWT_SECRET:}

gemini.api.key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
gemini.max-tokens=${GEMINI_MAX_TOKENS:4000}
gemini.temperature=${GEMINI_TEMPERATURE:0.7}
